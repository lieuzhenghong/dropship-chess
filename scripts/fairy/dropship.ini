# Dropship Chess as a Fairy-Stockfish variant, for scripts/ai-match.ts.
# pawnDropRegion* needs pawn-drop-region.patch (setup.sh applies it).

[dropship:crazyhouse]
maxRank = 6
maxFile = f
startFen = rnqkbr/pppppp/6/6/PPPPPP/RNQKBR[] w - - 0 1
# The King is an ordinary piece that loses the game when captured: no check,
# and moving into attack is legal.
king = -
commoner = k
extinctionValue = loss
extinctionPieceTypes = k
castling = false
doubleStep = false
promotionRegionWhite = *6
promotionRegionBlack = *1
promotionPieceTypes = q
# Pawns may be dropped anywhere except the opponent's back two ranks.
firstRankPawnDrops = true
promotionZonePawnDrops = true
pawnDropRegionWhite = *1 *2 *3 *4
pawnDropRegionBlack = *3 *4 *5 *6
# No legal move loses; no draws by repetition or move count.
stalemateValue = loss
nFoldRule = 0
nMoveRule = 0
